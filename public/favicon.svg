<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGradient)" />
  <!-- Gold accent ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGradient)" stroke-width="3" />
  <!-- F letter - Forbes style -->
  <text x="50" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">F</text>
  <!-- Subtle shine effect -->
  <ellipse cx="35" cy="35" rx="15" ry="8" fill="url(#goldGradient)" opacity="0.15" transform="rotate(-30, 35, 35)" />
</svg>